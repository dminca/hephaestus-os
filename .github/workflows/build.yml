name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - main
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  tests:
    name: Test workstation packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...

  dependencies:
    name: Validate locked dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .github/renovate/package.json
      - name: Install declared npm and locked projects
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          package_manager=$(node -p "require('./.github/renovate/package.json').packageManager")
          npm install --global "$package_manager"
          (cd .github/renovate && npm ci --no-audit --no-fund)
          (cd files/system/usr/share/hephaestus/node && npm ci --omit=dev --no-audit --no-fund)
      - name: Check dependency behavior and Renovate configuration
        run: |
          node --test tests/renovate-config.test.cjs tests/dependencies/*.test.cjs
          .github/renovate/node_modules/.bin/renovate-config-validator --strict renovate.json5
          git diff --exit-code -- '**/package*.json'
  bluebuild:
    name: Build Custom Image
    needs: [tests, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.41
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
