name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  tests:
    name: Test workstation packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...

  parsers:
    name: Build and load every Treesitter parser
    needs: tests
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: Install native parser build dependencies
        run: dnf install -y git golang neovim gcc gcc-c++ nodejs24 curl-minimal tar gzip unzip
      - uses: actions/checkout@v4
      - name: Check parser failure handling
        run: go test -count=1 ./tests -run TestParserBuildReportsCompleteFailures -v
      - name: Fetch pinned tools and compile all configured parsers
        shell: bash
        run: |
          set -euo pipefail
          export HEPHAESTUS_ASSETS="$GITHUB_WORKSPACE/files/system/usr/share/hephaestus"
          export PATH="/usr/libexec/hephaestus/bin:$PATH"
          go run ./files/system/usr/share/hephaestus/build-assets sources --lock "$HEPHAESTUS_ASSETS/sources.lock.json" --destination "$HEPHAESTUS_ASSETS/nvim/plugins"
          go run ./files/system/usr/share/hephaestus/build-assets binaries --lock "$HEPHAESTUS_ASSETS/binaries.lock.json"
          test "$(tree-sitter --version | cut -d ' ' -f 2)" = "0.26.1"
          nvim --headless -u NONE -l "$HEPHAESTUS_ASSETS/build-parsers.lua"

  bluebuild:
    name: Build Custom Image
    needs: [tests, parsers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
