name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - main
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  tests:
    name: Test workstation packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...

  dependencies:
    name: Validate locked dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .github/renovate/package.json
      - name: Install declared npm and locked projects
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          package_manager=$(node -p "require('./.github/renovate/package.json').packageManager")
          npm install --global "$package_manager"
          (cd .github/renovate && npm ci --no-audit --no-fund)
          (cd files/system/usr/share/hephaestus/node && npm ci --omit=dev --no-audit --no-fund)
      - name: Check dependency behavior and Renovate configuration
        run: |
          node --test tests/renovate-config.test.cjs tests/dependencies/node-runtime.test.cjs tests/dependencies/npm-install.test.cjs tests/dependencies/renovate-policy.test.cjs tests/dependencies/editor-tools.test.cjs
          .github/renovate/node_modules/.bin/renovate-config-validator --strict renovate.json5
          git diff --exit-code -- '**/package*.json'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: files/system/usr/share/hephaestus/python/.python-version
      - name: Validate Python hashes and lock synchronization
        run: |
          pip install -r .github/python-tools.txt
          cd files/system/usr/share/hephaestus/python
          pip-compile --generate-hashes --allow-unsafe --strip-extras --no-emit-index-url --output-file=requirements.txt requirements.in
          git diff --exit-code -- requirements.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: files/system/usr/share/hephaestus/go-tools/go.mod
      - name: Validate native tool installation constraints
        run: |
          cargo --version
          rustc --version
          go test -count=1 -tags=integration ./tests -run 'TestPython|TestGoTool|TestRust' -v

  node-runtimes:
    name: Check Node ${{ matrix.node }} / npm ${{ matrix.npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["24.11.0", "24.15.0", "24", "24.10.0", "24.14.0", "22", "26"]
        npm: ["declared"]
        include:
          - node: "24"
            npm: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .github/renovate/package.json
      - name: Install test dependencies with the supported runtime
        run: |
          package_manager=$(node -p "require('./.github/renovate/package.json').packageManager")
          npm install --global "$package_manager"
          (cd .github/renovate && npm ci --no-audit --no-fund)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Select npm version
        env:
          NPM_VERSION: ${{ matrix.npm }}
        run: |
          if [ "$NPM_VERSION" = declared ]; then
            package_manager=$(node -p "require('./.github/renovate/package.json').packageManager")
            npm install --global "$package_manager"
          else
            npm install --global "npm@$NPM_VERSION"
          fi
      - name: Test real runtime acceptance and rejection
        run: node --test tests/dependencies/node-runtime.test.cjs
      - name: Clean-install full graphs on supported runtimes
        if: matrix.npm == 'declared' && (matrix.node == '24.15.0' || matrix.node == '24')
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          (cd .github/renovate && npm ci --no-audit --no-fund)
          (cd files/system/usr/share/hephaestus/node && npm ci --omit=dev --no-audit --no-fund)
      - name: Clean-install editor graph at its lower supported boundary
        if: matrix.npm == 'declared' && matrix.node == '24.11.0'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: cd files/system/usr/share/hephaestus/node && npm ci --omit=dev --no-audit --no-fund

  parsers:
    name: Build and load every Treesitter parser
    needs: [tests, dependencies, node-runtimes]
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: Install native parser build dependencies
        run: dnf install -y git golang neovim gcc gcc-c++ nodejs24 nodejs24-npm curl-minimal tar gzip unzip xz skopeo jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify rolling base matches parser validation
        run: |
          source /etc/os-release
          expected="$VERSION_ID"
          base_version=$(skopeo inspect docker://ghcr.io/secureblue/kinoite-main-hardened:latest | jq -r '.Labels["org.opencontainers.image.version"]')
          bash files/system/usr/share/hephaestus/check-fedora-version.sh "$expected" "$base_version"
      - name: Install and check native editor tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          cd files/system/usr/share/hephaestus/node
          npm ci --omit=dev --no-audit --no-fund
          node --test "$GITHUB_WORKSPACE/tests/dependencies/editor-tools.test.cjs"
      - name: Check Neovim build validation
        run: go test -count=1 ./tests -run 'TestParserBuildReportsCompleteFailures|TestLanguageServerBuildValidation' -v
      - name: Fetch pinned tools and compile all configured parsers
        shell: bash
        run: |
          set -euo pipefail
          export HEPHAESTUS_ASSETS="$GITHUB_WORKSPACE/files/system/usr/share/hephaestus"
          export PATH="/usr/libexec/hephaestus/bin:$PATH"
          go run ./files/system/usr/share/hephaestus/build-assets sources --lock "$HEPHAESTUS_ASSETS/sources.lock.json" --destination "$HEPHAESTUS_ASSETS/nvim/plugins"
          go run ./files/system/usr/share/hephaestus/build-assets binaries --lock "$HEPHAESTUS_ASSETS/binaries.lock.json"
          expected_tree_sitter_version=$(go run ./files/system/usr/share/hephaestus/build-assets binary-version --lock "$HEPHAESTUS_ASSETS/binaries.lock.json" tree-sitter)
          test "$(tree-sitter --version | cut -d ' ' -f 2)" = "$expected_tree_sitter_version"
          nvim --headless -u NONE -l "$HEPHAESTUS_ASSETS/build-parsers.lua"

  bluebuild:
    name: Build Custom Image
    needs: [tests, parsers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify and pin Secureblue base image
        env:
          BASE_IMAGE: ghcr.io/secureblue/kinoite-main-hardened
          RECIPE: ${{ matrix.recipe }}
        shell: bash
        run: |
          set -euo pipefail
          base_digest="$(docker buildx imagetools inspect "${BASE_IMAGE}:latest" --format '{{json .Manifest}}' | jq -er '.digest')"
          if [[ ! "${base_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid Secureblue base image digest" >&2
            exit 1
          fi

          slsa-verifier verify-image \
            --source-uri github.com/secureblue/secureblue \
            --source-branch live \
            "${BASE_IMAGE}@${base_digest}"

          python3 - "${BASE_IMAGE}" "${base_digest}" "${RECIPE}" <<'PY'
          from pathlib import Path
          import sys

          base_image, digest, recipe_name = sys.argv[1:]
          recipe = Path("recipes") / recipe_name
          lines = recipe.read_text().splitlines(keepends=True)
          base_lines = [i for i, line in enumerate(lines) if line.startswith("base-image:")]
          version_lines = [i for i, line in enumerate(lines) if line.startswith("image-version:")]
          if len(base_lines) != 1 or len(version_lines) != 1:
              raise SystemExit(f"Expected one base-image and one image-version in {recipe}")

          lines[base_lines[0]] = f"base-image: {base_image}@sha256\n"
          lines[version_lines[0]] = f"image-version: {digest.removeprefix('sha256:')}\n"
          Path("recipes/recipe-pinned.yml").write_text("".join(lines))
          PY

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13
        with:
          recipe: recipe-pinned.yml
          cli_version: v0.9.37
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

      - name: Resolve published image digest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: published_image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          image_name="${IMAGE_NAME,,}"
          digest="$(docker buildx imagetools inspect "${image_name}:latest" --format '{{json .Manifest}}' | jq -er '.digest')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid image digest for ${image_name}:latest" >&2
            exit 1
          fi
          echo "image=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest published image provenance
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.published_image.outputs.image }}
          subject-digest: ${{ steps.published_image.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}
