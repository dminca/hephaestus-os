name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - main
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  tests:
    name: Test workstation packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - run: go test -count=1 ./...

  dependencies:
    name: Validate locked dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .github/renovate/package.json
      - name: Install declared npm and locked projects
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          package_manager=$(node -p "require('./.github/renovate/package.json').packageManager")
          npm install --global "$package_manager"
          (cd .github/renovate && npm ci --no-audit --no-fund)
          (cd files/system/usr/share/hephaestus/node && npm ci --omit=dev --no-audit --no-fund)
      - name: Check dependency behavior and Renovate configuration
        run: |
          node --test tests/renovate-config.test.cjs tests/dependencies/*.test.cjs
          .github/renovate/node_modules/.bin/renovate-config-validator --strict renovate.json5
          git diff --exit-code -- '**/package*.json'
  bluebuild:
    name: Build Custom Image
    needs: [tests, dependencies]
    runs-on: ubuntu-latest
    outputs:
      IMAGE_REF: ${{ steps.image_manifest_metadata.outputs.IMAGE_REF }}
      IMAGE_DIGEST: ${{ steps.image_manifest_metadata.outputs.IMAGE_DIGEST }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - name: Create digestfile
        id: digestfile
        run: echo "digestfile=$(mktemp)" >> "$GITHUB_OUTPUT"

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@fb86c457fd3d0e13d5e9c1875c6305cf28b09234 # v1.14.0
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.42
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
          digestfile: ${{ steps.digestfile.outputs.digestfile }}

      - name: Output image digest
        id: image_manifest_metadata
        shell: bash
        env:
          DIGESTFILE: ${{ steps.digestfile.outputs.digestfile }}
          IMAGE_REF_PREFIX: "ghcr.io/${{ github.repository }}:"
        run: |
          set -euo pipefail
          IMAGE_REF=$(jq -er --arg prefix "${IMAGE_REF_PREFIX,,}" \
            'keys | map(select(startswith($prefix))) | if length == 1 then .[0] else error("expected exactly one image digest") end' \
            "${DIGESTFILE}")
          IMAGE_DIGEST=$(jq -er --arg ref "${IMAGE_REF}" '.[$ref]' "${DIGESTFILE}")
          echo "IMAGE_REF=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

  provenance:
    if: github.ref == 'refs/heads/main'
    needs: [bluebuild]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@85f26c270f0c7a4d73515845349629a2dfd023f4 # v0.2.2 # zizmor: ignore[unpinned-uses]
    with:
      build-from-source: false
      # renovate: datasource=github-releases depName=slsa-framework/attester
      version: v0.1.1
      watch-jobs: bluebuild
      collect-artifacts: false
      subjects: ${{ needs.bluebuild.outputs.IMAGE_DIGEST }}
      artifact-name: slsa-provenance-hephaestus-os

  push-provenance:
    if: github.ref == 'refs/heads/main'
    needs: [bluebuild, provenance]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Install oras
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.3.6

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | oras login --username "${GITHUB_ACTOR}" --password-stdin ghcr.io

      - name: Download SLSA attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slsa-provenance-hephaestus-os

      - name: Push provenance
        env:
          IMAGE_REF: ${{ needs.bluebuild.outputs.IMAGE_REF }}
          IMAGE_DIGEST: ${{ needs.bluebuild.outputs.IMAGE_DIGEST }}
        run: |
          artifact_ref="${IMAGE_REF%:*}:${IMAGE_DIGEST/:/-}-provenance"
          oras push "${artifact_ref}" provenance.intoto.json:application/vnd.dsse.envelope.v1+json
