name: Container retention

on:
  workflow_run:
    workflows: [bluebuild]
    types: [completed]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "35 8 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete obsolete versions after reviewing a dry-run
        type: boolean
        default: false
      expected_plan:
        description: Plan fingerprint from the reviewed dry-run (required for manual apply)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  retention:
    if: >-
      github.repository == 'dminca/hephaestus-os' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ghcr-hephaestus-os
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      # Never check out a PR ref or execute artifacts from the triggering run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Plan or apply image retention
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_APPLY: ${{ inputs.apply || false }}
          EXPECTED_PLAN: ${{ inputs.expected_plan }}
          AUTO_APPLY: ${{ vars.CONTAINER_RETENTION_AUTO_APPLY }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$MANUAL_APPLY" == true ]]; then
              if [[ -z "$EXPECTED_PLAN" ]]; then
                echo "::error::Manual apply requires the fingerprint from a reviewed dry-run."
                exit 1
              fi
              args+=(--apply --expected-plan "$EXPECTED_PLAN")
            fi
          elif [[ "$AUTO_APPLY" == true ]]; then
            args+=(--apply)
          fi
          node .github/scripts/container-retention.cjs "${args[@]}"
