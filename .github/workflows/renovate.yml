name: Renovate

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .github/renovate/package.json

      - name: Install declared npm version
        run: |
          package_manager=$(node -p "require('./.github/renovate/package.json').packageManager")
          npm install --global "$package_manager"

      - name: Install locked Renovate
        working-directory: .github/renovate
        run: npm ci --no-audit --no-fund

      - name: Validate Renovate configuration and authentication
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          cd files/system/usr/share/hephaestus/node
          npm ci --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          .github/renovate/node_modules/.bin/renovate-config-validator --strict renovate.json5
          node --test tests/renovate-config.test.cjs tests/dependencies/node-runtime.test.cjs tests/dependencies/npm-install.test.cjs tests/dependencies/renovate-policy.test.cjs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: files/system/usr/share/hephaestus/go-tools/go.mod

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: files/system/usr/share/hephaestus/python/.python-version

      - name: Install Python lock compiler
        run: pip install -r .github/python-tools.txt

      - name: Install minisign for Flow release verification
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hephaestus-os
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Run Renovate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_CONFIG_FILE: .github/renovate-global.js
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/renovate/node_modules/.bin/renovate
