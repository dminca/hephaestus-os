---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: hephaestus-os
# description will be included in the image's metadata
description: Secureblue Kinoite with personal workstation customizations.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest # You can pin to a specific version of Fedora as well
platforms:
  - linux/amd64

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - fzf
        - zoxide
        - golang
        - powerline-go
        - eza
        - fd-find
        - ripgrep
        - atuin
        - bat
        - btop
        - gum
        - direnv
        - tmux
        - neovim
        - git-lfs
        - git-delta
        - gh
        - gcc
        - gcc-c++
        - make
        - xz
        - gmp
        - ncurses-compat-libs
        - zlib-ng-compat
        - cargo
        - rust
        - nodejs24
        - nodejs24-npm
        - python3
        - python3-pip
        - gopls
        - rust-analyzer
        - ruff
        - ShellCheck
        - shfmt
        - libxml2
        - ImageMagick
        - ghostscript
        - glow
        - pandoc-cli
        - wl-clipboard
        - minisign
        - gstreamer1
        - gstreamer1-plugin-libav
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: script
    scripts:
      - install-flow-desktop.sh
      - install-profile.sh

  - type: default-flatpaks@v1
    notify: true
    system:
      repo-name: flathub
      install:
        - com.nextcloud.desktopclient.nextcloud
      remove:
        - org.mozilla.firefox
    user:
      repo-name: flathub
      remove:
        - org.mozilla.firefox

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
