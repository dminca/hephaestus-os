---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: hephaestus-os
# description will be included in the image's metadata
description: Secureblue Kinoite with personal workstation customizations.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest # You can pin to a specific version of Fedora as well
blue-build-tag: v0.9.42
nushell-version: 0.113.1@sha256:11610351f920a8284a0b60032e9d9e3d26d1fe273f431d30835306c18aa32ddb
platforms:
  - linux/amd64

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    source: ghcr.io/blue-build/modules/files:latest@sha256:bf218419391bfd7dbd9e6b930e7a6e6f8de5c3a8a24528d69f0cde04f53a96a5
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    source: ghcr.io/blue-build/modules/dnf:latest@sha256:411a59683bf0a8092b15e4d4e406533dc818e42a7b48b46736c6d76a23569c73
    install:
      packages:
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - fzf
        - zoxide
        - golang
        - powerline-go
        - eza
        - ripgrep
        - atuin
        - bat
        - btop
        - gum
        - direnv
        - tmux
        - neovim
        - nix-core
        - git-lfs
        - git-delta
        - git-credential-libsecret
        - gh
        - gcc
        - gcc-c++
        - make
        - xz
        - gmp
        - ncurses-compat-libs
        - zlib-ng-compat
        - cargo
        - rust
        - nodejs24
        - nodejs24-npm
        - python3
        - libxml2
        - ImageMagick
        - ghostscript
        - glow
        - pandoc-cli
        - wl-clipboard
        - minisign
        - gstreamer1
        - gstreamer1-plugin-libav
  - type: brew
    source: ghcr.io/blue-build/modules/brew:latest@sha256:46aa07ce405c6198a255d13df9b003e2bcd5b3aee30efa3204d04df483da5935
    brew-analytics: false
  - type: script
    source: ghcr.io/blue-build/modules/script:latest@sha256:04bff0d405b71c7d49d5c7499ad7a42f1bcf5fa339c6381ddbeef376c332c122
    scripts:
      - install-flow-desktop.sh
      - install-jetbrains-mono-nerd-font.sh
      - install-profile.sh
      - install-fd.sh

  - type: default-flatpaks@v2
    source: ghcr.io/blue-build/modules/default-flatpaks:v2@sha256:8a567e7b9ab6baa1e1f690adf799feb08b24e3a51dd0c458d23eb2cfa18a1d17
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub-verified
          title: Flathub Verified
        install:
          - com.nextcloud.desktopclient.nextcloud

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
    source: ghcr.io/blue-build/modules/signing:latest@sha256:2d5d3e8ab5411fc97a97a12e1beead74f7106f047ea87a58adf48c856b437108
