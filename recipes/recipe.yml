---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: hephaestus-os
# description will be included in the image's metadata
description: Secureblue Kinoite with personal workstation customizations.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest # You can pin to a specific version of Fedora as well
blue-build-tag: v0.9.42
nushell-version: 0.113.1@sha256:11610351f920a8284a0b60032e9d9e3d26d1fe273f431d30835306c18aa32ddb
platforms:
  - linux/amd64

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    source: ghcr.io/blue-build/modules/files:latest@sha256:dd10df5923fd8e2072602fcd46f17b394302428fa2aad88248c34c6a8d01046f
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    source: ghcr.io/blue-build/modules/dnf:latest@sha256:bbbc7755ce64b2a40d7cd4c0c974641d109e3959ff001d88cd5b746b1349ee59
    install:
      packages:
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - fzf
        - zoxide
        - golang
        - powerline-go
        - eza
        - ripgrep
        - atuin
        - bat
        - btop
        - gum
        - direnv
        - tmux
        - neovim
        - nix-core
        - git-lfs
        - git-delta
        - git-credential-libsecret
        - gh
        - gcc
        - gcc-c++
        - make
        - xz
        - gmp
        - ncurses-compat-libs
        - zlib-ng-compat
        - cargo
        - rust
        - nodejs24
        - nodejs24-npm
        - python3
        - libxml2
        - ImageMagick
        - ghostscript
        - glow
        - pandoc-cli
        - wl-clipboard
        - minisign
        - gstreamer1
        - gstreamer1-plugin-libav
  - type: brew
    source: ghcr.io/blue-build/modules/brew:latest@sha256:c60db94644b437cf57d689405df56f80fe24ba1094dd67703f07ee1b96c99ef7
    brew-analytics: false
  - type: script
    source: ghcr.io/blue-build/modules/script:latest@sha256:7c53921aee3ea68f91edacccac13f793ec63424d1376b0b0c8b1c0b56eca5b4c
    scripts:
      - install-flow-desktop.sh
      - install-jetbrains-mono-nerd-font.sh
      - install-profile.sh
      - install-fd.sh

  - type: default-flatpaks@v2
    source: ghcr.io/blue-build/modules/default-flatpaks:v2@sha256:794205d13ab32454027a8d22753fe8224fbbc6dd206927df152a4fe56634e40c
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub-verified
          title: Flathub Verified
        install:
          - com.nextcloud.desktopclient.nextcloud

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
    source: ghcr.io/blue-build/modules/signing:latest@sha256:e39c874a0d41d41198fe608ba23bd7dc98305ea79003fbecc757e176bdad5eb1
