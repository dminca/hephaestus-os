---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: hephaestus-os
# description will be included in the image's metadata
description: Secureblue Kinoite with personal workstation customizations.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest # You can pin to a specific version of Fedora as well
blue-build-tag: v0.9.37
nushell-version: 0.113.1@sha256:11610351f920a8284a0b60032e9d9e3d26d1fe273f431d30835306c18aa32ddb
platforms:
  - linux/amd64

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    source: ghcr.io/blue-build/modules/files:latest@sha256:c93091889e5552a25d8169f8b5ba6d2cf201fd924f342025e6f2388c1ac4a356
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    source: ghcr.io/blue-build/modules/dnf:latest@sha256:e6cffa08197dc55f2cdc9f596e5bae6af4dc82e8a33884ff5a4edccc251b0218
    install:
      packages:
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - fzf
        - zoxide
        - golang
        - powerline-go
        - eza
        - fd-find
        - ripgrep
        - atuin
        - bat
        - btop
        - gum
        - direnv
        - tmux
        - neovim
        - nix-core
        - git-lfs
        - git-delta
        - gh
        - gcc
        - gcc-c++
        - make
        - xz
        - gmp
        - ncurses-compat-libs
        - zlib-ng-compat
        - cargo
        - rust
        - nodejs24
        - nodejs24-npm
        - python3
        - python3-pip
        - gopls
        - rust-analyzer
        - ruff
        - ShellCheck
        - shfmt
        - libxml2
        - ImageMagick
        - ghostscript
        - glow
        - pandoc-cli
        - wl-clipboard
        - minisign
        - gstreamer1
        - gstreamer1-plugin-libav
  - type: script
    source: ghcr.io/blue-build/modules/script:latest@sha256:d6076360da9195e2a6d781043a1b049bede3d2389757912a828a957bc78929b8
    scripts:
      - install-flow-desktop.sh
      - install-profile.sh

  - type: default-flatpaks@v2
    source: ghcr.io/blue-build/modules/default-flatpaks:v2@sha256:9a57a74188d54cd717520a6c434ddfa41346f769b48bbb3bbf418538180f8397
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
        install:
          - com.nextcloud.desktopclient.nextcloud
          - org.signal.Signal
      - scope: user
        notify: true
        repo:
          name: flathub

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
    source: ghcr.io/blue-build/modules/signing:latest@sha256:6227e5ac294e9b60a77836775700df879d8a39b184ca3e511edf73cc58f1f4a6
